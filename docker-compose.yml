services:
  postgres:
    image: postgres:16
    container_name: ritor_postgres
    environment:
      POSTGRES_DB: ritor_lms
      POSTGRES_USER: ritor_user
      POSTGRES_PASSWORD: ritor_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritor_user -d ritor_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ritor_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ritor_lms
      DB_USER: ritor_user
      DB_PASSWORD: ritor_password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: